[project]
name = "byox-bloom-filter"
version = "0.0.1"
description = "Karnstack BYOX starter: Bloom filter, Python variant."
requires-python = ">=3.14"
license = { text = "MIT" }

[project.optional-dependencies]
test = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bloom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
